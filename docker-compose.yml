services:
  backend:
    build: ./backend
    ports:
      - '8080:8080'
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend

  kafka:
    extends:
      file: ./kafka/docker-compose.yml
      service: kafka
